# Builds the documentation site (site/) and publishes it on GitHub Pages: https://bierdav.github.io/solveng/
# The site runs src/solveng.wasm in the browser, so a new engine build republishes it too. A release
# pushes with GITHUB_TOKEN, which starts no push workflows, so release.yml starts this one itself.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/solveng.wasm"
      - "src/unit-words.typ"
      - "src/constants.typ"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
