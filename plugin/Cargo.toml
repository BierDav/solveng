[package]
name = "solveng-plugin"
description = "solveng's engine as a Typst plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
solveng-names = { path = "../names", version = "=1.0.0" }
solveng-core = { path = "../core" }
wasm-minimal-protocol = "0.2"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
