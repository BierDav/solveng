[package]
name = "solveng-core"
description = "The calculation engine of solveng: units, a symbolic and numeric solver, and Typst markup of the results"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
solveng-names = { path = "../names", version = "=1.0.0" }
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }

serde_json = "1"
blake3 = "1"

[dev-dependencies]
ciborium = "0.2"
